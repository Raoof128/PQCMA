# OpenSSL Configuration
# QUANTUM VULNERABLE - uses RSA and ECDSA

[ req ]
default_bits = 2048
default_keyfile = privkey.pem
distinguished_name = req_distinguished_name
attributes = req_attributes
x509_extensions = v3_ca

[ req_distinguished_name ]
countryName = AU
countryName_default = AU
stateOrProvinceName = State or Province Name
stateOrProvinceName_default = Queensland
localityName = Locality Name
localityName_default = Brisbane
organizationName = Organization Name
organizationName_default = Example Corp
commonName = Common Name
commonName_max = 64

[ req_attributes ]
challengePassword = A challenge password
challengePassword_min = 4
challengePassword_max = 20

[ v3_ca ]
subjectKeyIdentifier=hash
authorityKeyIdentifier=keyid:always,issuer
basicConstraints = critical,CA:true

# Cipher configuration - QUANTUM VULNERABLE
[ ssl_config ]
CipherString = ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:RSA-AES256-GCM-SHA384
MinProtocol = TLSv1.2

# Certificate policy
[ policy_match ]
SignatureAlgorithm = sha256WithRSAEncryption
